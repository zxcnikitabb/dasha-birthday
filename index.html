<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения, Даша! 🎂</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div class="balloons" id="balloons"></div>

  <main class="container">
    <h1 class="title">С Днём Рождения,</h1>
    <h2 class="name">Даша!</h2>
    
    <div class="cake">
      <div class="candle">
        <div class="flame"></div>
      </div>
    </div>

    <p class="message">
      Пусть каждый день будет наполнен радостью,<br>
      улыбками и волшебством ✨<br>
      Ты — самая лучшая!
    </p>

    <button class="btn" id="btn">Нажми меня 🎁</button>

    <div class="date">6 октября</div>
  </main>

  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>🎊 Сюрприз! 🎊</h3>
      <p>Даша, ты — невероятная!<br>Пусть сбудется всё, о чём мечтаешь.<br>Обнимаю крепко! 🤗💖</p>
      <button class="btn" id="close-modal">Закрыть</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
